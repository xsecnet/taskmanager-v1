server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Body upload max 12MB (file attachment max 10MB + overhead)
  client_max_body_size 12m;

  # =========================
  # Security headers
  # =========================
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # =========================
  # Reverse proxy ke backend
  # =========================
  # Semua request /api/* dilanjutkan ke service "backend" pada Docker
  # network. Same-origin → cookie sesi & SSE jalan tanpa pusing CORS.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeout default cukup untuk REST biasa.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # SSE membutuhkan koneksi long-lived dan flushing instan.
  location /api/events {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    chunked_transfer_encoding off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
  }

  # Static attachment
  location /uploads/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # =========================
  # Service worker tidak boleh di-cache lama
  # =========================
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # =========================
  # Static SPA
  # =========================
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
